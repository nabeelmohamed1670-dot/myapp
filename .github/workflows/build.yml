name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    
    - name: Install all dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential python3-dev libjpeg-dev zlib1g-dev \
          libtiff-dev libfreetype6-dev liblcms2-dev libharfbuzz-dev \
          libwebp-dev git wget curl libffi-dev libssl-dev
    
    - name: Install Python tools
      run: |
        pip install --upgrade pip
        pip install cython==0.29.32 buildozer kivy
    
    - name: Download and setup Android SDK
      run: |
        mkdir -p ~/android-sdk
        cd ~/android-sdk
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11092837_latest.zip
        unzip -q commandlinetools-linux-11092837_latest.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true
        export ANDROID_SDK_ROOT=~/android-sdk
        export PATH=$PATH:~/android-sdk/cmdline-tools/latest/bin
        yes | sdkmanager --licenses 2>&1 | head -20
        sdkmanager "platforms;android-31" 2>&1 | tail -5
        sdkmanager "build-tools;31.0.0" 2>&1 | tail -5
        sdkmanager "ndk;25.1.8937393" 2>&1 | tail -5
    
    - name: Build APK
      env:
        ANDROID_SDK_ROOT: /home/runner/android-sdk
        ANDROID_NDK_ROOT: /home/runner/android-sdk/ndk/25.1.8937393
        JAVA_HOME: /usr/lib/jvm/temurin-17-jdk-amd64
      run: |
        buildozer android debug 2>&1 | tail -100
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: calculator-apk
        path: bin/*.apk
        retention-days: 30
    
    - name: Show result
      run: ls -lah bin/ || echo "No APK found"

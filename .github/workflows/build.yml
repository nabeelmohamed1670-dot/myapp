name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-11-jdk build-essential python3-dev libjpeg-dev zlib1g-dev libtiff-dev libfreetype6-dev liblcms2-dev libharfbuzz-dev libwebp-dev
        pip install --upgrade cython==0.29.32 buildozer kivy
    
    - name: Setup Android SDK
      run: |
        mkdir -p ~/Android
        cd ~/Android
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
        unzip -q commandlinetools-linux-9477386_latest.zip
        mkdir -p cmdline-tools/latest
        mv cmdline-tools/* cmdline-tools/latest/ || true
        rm -rf commandlinetools-linux-9477386_latest.zip
    
    - name: Install Android packages
      run: |
        export ANDROID_HOME=~/Android
        export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-31"
        sdkmanager "build-tools;31.0.0"
        sdkmanager "ndk;25.1.8937393"
    
    - name: Build APK
      env:
        ANDROID_HOME: /root/Android
        ANDROID_SDK_ROOT: /root/Android
        ANDROID_NDK_ROOT: /root/Android/ndk/25.1.8937393
      run: buildozer android debug
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: calculator-apk
        path: bin/*.apk
